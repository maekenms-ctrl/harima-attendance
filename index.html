  return same.length > 1 && given ? sur + given[0] : sur;   // 同じ名字は「西川颯」「西川桜」のように名前の1文字目を付ける
};
const families = () => S.team.families || [];

// 「変更」＝当初の予定（締切までの回答。締切がない行事は最初の回答）から、父・母の参加や配車が変わったこと
function withChanges(prev, r, ev) {
  const pick = x => ({ father: x.father || '', mother: x.mother || '', car: !!x.car });
  const afterDeadline = ev && ev.deadline && todayStr() > ev.deadline;
  let orig;
  if (!prev) orig = pick(r);                                   // 最初の回答
  else if (ev && ev.deadline && !afterDeadline) orig = pick(r); // 締切までは何度直しても「当初の予定」
  else orig = prev.orig || pick(prev);
  r.orig = orig;
  r.chg = { father: orig.father !== (r.father || ''), mother: orig.mother !== (r.mother || ''), car: orig.car !== !!r.car };
  return r;
}
async function saveAnswer(fid, eid, d, by) {
  if (!d.father || !d.mother) { toast('父・母の参加を選んでください'); return; }
  const r = withChanges(ans(fid, eid), { father: d.father, mother: d.mother, car: d.car, seats: d.car ? d.seats : 0, self: d.self, note: (d.note || '').trim().slice(0, 80), by, at: Date.now() }, S.events.find(e => e.id === eid));
  S.saving[eid] = true; render();
  try {
    await S.db.doc(`${BASE}/answers/${fid}`).set({ responses: { [eid]: r } }, { merge: true });
    toast(by === 'proxy' ? '代理で保存しました' : '回答しました');
    if (by === 'proxy') S.sheet = null;
  } catch (e) { writeErr(e); }
  S.saving[eid] = false; render();
}

// 出席表の中身（画面とコピーで共通）。今のExcelと同じ書き方：○／×／－
function sheetData(ev, rows, x) {
  const mk = v => v === '○' ? '○' : v === '×' ? '×' : '－';
  const tb = ev.toban || [], whoMap = ev.tobanWho || {};
  const out = [], col = [];
  for (const { f, a } of rows) {
    const isTb = tb.includes(f.id), who = whoMap[f.id] || '母';
    const c = ['', '', '', ''];
    if (a) {

// 出席表を画像（PNG）にする。Excelと同じ配色
function sheetCanvas(X) {
  const S2 = 2, W = [190, 80, 80, 80, 300], PAD = 10, LH = 30, FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';

  const fill = { toban: XL.toban, change: XL.change, self: XL.self };
  const wrap = (t, w, size) => { g.font = `${size}px ${FONT}`; const out = []; let line = '';
    for (const ch of String(t)) { if (g.measureText(line + ch).width > w - PAD * 2 && line) { out.push(line); line = ch; } else line += ch; }
    if (line) out.push(line); return out.length ? out : ['']; };
  const rows = [];
  rows.push({ type: 'title', h: 40 });
  rows.push({ type: 'head', h: LH });
  X.rows.forEach((r, i) => { const n = wrap(r[4] === '未回答' ? '' : r[4], W[4], 15).length; rows.push({ type: 'row', i, h: Math.max(LH, n * 20 + 10) }); });
  rows.push({ type: 'total', h: LH }); rows.push({ type: 'gap', h: 12 });
  ['当番', '変更', '自走'].forEach((k, j) => { const n = wrap(X.foot[j], TW - W[0], 15).length; rows.push({ type: 'foot', k, j, h: Math.max(LH, n * 20 + 10) }); });
  const H = rows.reduce((a, r) => a + r.h, 0);
  cv.width = (TW + M * 2) * S2; cv.height = (H + M * 2) * S2; g.scale(S2, S2);
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, TW + M * 2, H + M * 2);
  g.textBaseline = 'middle'; g.lineWidth = 1; g.strokeStyle = '#000000';
  const cell = (x, y, w, h, text, o = {}) => {
    if (o.bg) { g.fillStyle = o.bg; g.fillRect(x, y, w, h); }
    g.strokeRect(x + .5, y + .5, w, h);
    if (o.diag) { g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w, y); g.stroke(); }
    if (text === '' || text == null) return;
    const size = o.size || 15; g.font = `${o.bold ? 'bold ' : ''}${size}px ${FONT}`; g.fillStyle = o.color || '#000000';
    if (o.left) { const ls = wrap(text, w, size); g.font = `${o.bold ? 'bold ' : ''}${size}px ${FONT}`; ls.forEach((l, k) => g.fillText(l, x + PAD, y + h / 2 + (k - (ls.length - 1) / 2) * 20)); }
    else { g.textAlign = 'center'; g.fillText(text, x + w / 2, y + h / 2); g.textAlign = 'left'; }
  };
  let y = M;
  for (const r of rows) {
    let x = M;
    if (r.type === 'title') cell(x, y, TW, r.h, X.title, { bg: XL.title, bold: true, size: 19 });
    else if (r.type === 'head') ['氏名', '父', '母', '配車', '備考'].forEach((t, k) => { cell(x, y, W[k], r.h, t, { bg: XL.head }); x += W[k]; });
    else if (r.type === 'row') { const d = X.rows[r.i], c = X.colors[r.i];
      d.forEach((t, k) => { const none = t === '未回答';
        cell(x, y, W[k], r.h, t, k === 4 ? { left: true, color: none ? '#8A8F98' : '#000000', size: none ? 13 : 15 } : { bg: c[k] ? fill[c[k]] : null, size: k ? 17 : 15 }); x += W[k]; }); }
    else if (r.type === 'total') { cell(x, y, W[0], r.h, '計', { bg: XL.head, bold: true }); x += W[0];
      X.total.forEach((n, k) => { cell(x, y, W[k + 1], r.h, String(n), { bg: XL.head, bold: true }); x += W[k + 1]; }); cell(x, y, W[4], r.h, '', { diag: true }); }
    else if (r.type === 'foot') { cell(x, y, W[0], r.h, r.k, { bg: [XL.toban, XL.change, XL.self][r.j] }); cell(x + W[0], y, TW - W[0], r.h, X.foot[r.j], { left: true }); }

}

// ---------- LINEの回答文の読み取り ----------
const MARK = '○〇◯⭕ＯOoｏ0０×✕✖xXＸ✗';   // 文字認識で○が「O」「0」になることがあるので含める
const normName = t => String(t || '').replace(/[\s　・]/g, '');
const toMark = c => /[○〇◯⭕ＯOoｏ0０]/.test(c) ? '○' : '×';
const EMOJI = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu;

function lineClean(text) {
  return String(text || '').replace(/\r/g, '').split('\n').map(l => {
    let t = l;
    const parts = t.split('\t');   // トーク履歴の「19:58<TAB>名前<TAB>本文」
    if (parts.length >= 3 && /^\d{1,2}:\d{2}$/.test(parts[0].trim())) t = parts.slice(2).join(' ');
    return t.replace(/^"+|"+$/g, '').trim();
  }).filter(l => l && !/^\d{4}[\/.]\d{1,2}[\/.]\d{1,2}/.test(l) && !/^\[LINE\]/.test(l) && !/^保存日時/.test(l));
}

function nameAtStart(line, F) {
  const n = normName(line);
  let full = F.filter(f => f.full && n.startsWith(f.full));
  if (full.length) { const L = Math.max(...full.map(f => f.full.length)); return { ids: full.filter(f => f.full.length === L).map(f => f.id), len: L }; }
  let sur = F.filter(f => f.sur && n.startsWith(f.sur));
  if (!sur.length) return null;
  const L = Math.max(...sur.map(f => f.sur.length));
  sur = sur.filter(f => f.sur.length === L);
  if (sur.length > 1) {   // 同じ名字（西川さんなど）は名前の1文字目で絞る
    const rest = n.slice(L);
    const narrowed = sur.filter(f => f.given && rest.startsWith(f.given[0]));
    if (narrowed.length) sur = narrowed;
  }
  const extra = sur.length === 1 && sur[0].given && n.slice(L).startsWith(sur[0].given) ? sur[0].given.length : 0;
  return { ids: sur.map(f => f.id), len: L + extra };
}

function cutName(line, len) {   // 行の先頭から、空白を除いて len 文字分を取り除く
  let i = 0, c = 0;
  while (i < line.length && c < len) { if (!/[\s　・]/.test(line[i])) c++; i++; }
  return line.slice(i);
}

function markFor(text, key) {
  const neg = new RegExp(key + '[^\\n' + MARK + ']{0,4}?(不参加|欠席|なし|無し|不可|できません|出来ません|NG)');
  const m = text.match(new RegExp(key + '[^\\n' + MARK + ']{0,5}?([' + MARK + '])'));
  if (m) return toMark(m[1]);
  if (neg.test(text)) return '×';
  if (new RegExp(key + '\\s*[ー－—―\\-]+\\s*($|\\n)').test(text)) return '';   // 「父ー」は空欄（該当なし）
  if (new RegExp(key + '[^\\n]{0,4}?(参加|出席|あり|有り|可|できます|出来ます|OK|ok|行きます)').test(text)) return '○';
  return '';
}

function parseLine(text, families) {
  const F = families.map(f => {
    const parts = String(f.name).trim().split(/[\s　]+/);
    return { id: f.id, full: normName(f.name), sur: parts.length > 1 ? parts[0] : '', given: parts.length > 1 ? parts.slice(1).join('') : '' };
  });
  const lines = lineClean(text);
  const blocks = []; const loose = [];
  let cur = null;
  for (const l of lines) {
    if (/^(\d+\s*(日|時間|分)前|昨日|今日)?\s*\d{1,2}:\d{2}$/.test(l) || /^\d+\s*(日|時間|分)前$/.test(l)) { cur = null; continue; }   // スクショの時刻＝コメントの区切り
    const hit = nameAtStart(l, F);
    if (hit) { cur = { ids: hit.ids, lines: [cutName(l, hit.len)] }; blocks.push(cur); }
    else if (cur) cur.lines.push(l);
    else loose.push(l);
  }
  const rows = blocks.map(b => {
    const body = b.lines.join('\n');
    let father = markFor(body, '父'), mother = markFor(body, '母');
    const both = markFor(body, '父母');
    if (both) { if (!/父(?!母)/.test(body.replace(/父母/g, ''))) father = both; mother = mother || both; if (!father) father = both; }
    const carMark = markFor(body, '配車');
    const seatM = body.match(/配車[^\n]*?(\d+)\s*[人名]/) || body.match(/(\d+)\s*[人名](まで)?乗/);
    const self = /自走/.test(body) && !/自走[^\n]{0,3}(なし|無し|しない|しません)/.test(body);
    const toban = /当番/.test(body) && !/当番[^\n]{0,4}(ではない|じゃない|なし|無し|外)/.test(body);
    const note = b.lines.map(l => l
      .replace(EMOJI, '')
      .replace(new RegExp('(父母|父|母|配車)[^\\n' + MARK + ']{0,5}?[' + MARK + ']', 'g'), '')
      .replace(/(父母|父|母|配車)\s*[→⇒>＞:：=＝は\-ー－—―\s]*(不参加|欠席|なし|無し|不可|参加|出席|あり|有り|可|できます|出来ます|できません|行きます)?/g, '')
      .replace(/\d+\s*[人名](まで)?(乗れます|乗車可|乗せられます)?/g, '')
      .replace(/当番(です|になります|でした)?/g, '').replace(/自走(です|します)?/g, '')
      .replace(/[→⇒➡➔➜›»＞>]+/g, ' ').replace(/(^|\s)[-－ー—―=＝:：]+(?=\s|$)/g, ' ')
      .replace(/よろしく(お願い)?(いた)?(し|致し)?ます[!！。]*|お願い(いた)?(し|致し)?ます[!！。]*|宜しく[^\n]*/g, '')
      .replace(/^(です|になります)[。！!]*$/, '')
      .replace(/^[\s、。,，・:：→]+|[\s、。,，・]+$/g, '').trim()
    ).filter(Boolean).join(' ').slice(0, 80);
    return {
      ids: b.ids, familyId: b.ids.length === 1 ? b.ids[0] : '', father, mother,
      car: carMark === '○', seats: carMark === '○' && seatM ? Math.min(7, Number(seatM[1])) : (carMark === '○' ? 0 : 0),
      self, toban, note, raw: body, include: b.ids.length === 1,
    };
  });
  return { rows, loose };
}

async function importRows(ev) {
  const P = S.paste;
  const rows = P.rows.filter(r => r.include && r.familyId);
  const batch = S.db.batch();
  const now = Date.now();
  rows.forEach((r, i) => {
    batch.set(S.db.doc(`${BASE}/answers/${r.familyId}`), { responses: { [ev.id]: withChanges(ans(r.familyId, ev.id), {
      father: r.father, mother: r.mother, car: !!r.car, seats: r.car ? (Number(r.seats) || 0) : 0, self: !!r.self,
      note: (r.note || '').trim().slice(0, 80), by: 'line', at: now + i }, ev) } }, { merge: true });
  });
  const addToban = rows.filter(r => r.toban).map(r => r.familyId).filter(id => !(ev.toban || []).includes(id));
  if (addToban.length) {
    const who = { ...(ev.tobanWho || {}) };
    rows.filter(r => r.toban && addToban.includes(r.familyId)).forEach(r => { who[r.familyId] = r.father === '○' && r.mother !== '○' ? '父' : '母'; });
    batch.set(S.db.doc(`${BASE}/events/${ev.id}`), { toban: [...(ev.toban || []), ...addToban], tobanWho: who }, { merge: true });
  }
  try {
    await batch.commit();
    S.paste = { text: '', rows: null, loose: [], ev: null };
    toast(`${rows.length}件を取り込みました` + (addToban.length ? `（当番 ${addToban.length}家庭を追加）` : ''));
    render();
  } catch (e) { writeErr(e); }
}

      h('div', { class: 'sheet', role: 'dialog', 'aria-label': '出席表の画像' },
        h('h2', null, '出席表の画像'),
        h('span', { class: 'muted' }, '画像を長押しして「共有」→ LINE、または「"写真"に保存」してからLINEで送ってください。パソコンでは右クリックで保存できます。'),
        h('img', { src: S.imgUrl, alt: '出席表', style: 'width:100%;border:1px solid var(--line);border-radius:6px' }),
        h('div', { class: 'row' },
          S.imgFile ? h('button', { class: 'btn', onclick: () => navigator.share({ files: [S.imgFile] }).catch(() => {}) }, '共有（LINEなど）') : null,
          h('button', { class: 'btn ghost', onclick: () => { URL.revokeObjectURL(S.imgUrl); S.imgUrl = null; S.imgFile = null; renderLayer(); } }, '閉じる')))));
    return;
  }
  if (!S.sheet) { layer.replaceChildren(); return; }
  const { fid, eid, d } = S.sheet; const ev = S.events.find(e => e.id === eid); const f = famById(fid);
  if (!ev || !f) { S.sheet = null; layer.replaceChildren(); return; }
  layer.replaceChildren(h('div', { class: 'sheet-bg', onclick: e => { if (e.target === e.currentTarget) { S.sheet = null; renderLayer(); } } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-label': '代理入力' },
      h('div', null, h('div', { class: 'label' }, '係による代理入力'), h('h2', null, f.name), h('span', { class: 'muted' }, `${fmtDate(ev.date)} ${ev.title}`)),
      answerForm(d, renderLayer, 'proxy'),
      h('div', { class: 'row between' },
        h('button', { class: 'btn ghost', onclick: () => { S.sheet = null; renderLayer(); } }, '閉じる'),
        h('button', { class: 'btn', disabled: !d.father || !d.mother, onclick: () => saveAnswer(fid, eid, d, 'proxy') }, '代理で保存')))));
}

// ----- 管理 -----
function adminView() {
  const out = [];
  const codeVal = S.newCode == null ? S.code : S.newCode;
  out.push(h('div', { class: 'card' },
    h('h2', null, 'チームの合言葉'),
    h('span', { class: 'muted' }, '保護者が初めてログインしたときに入れる言葉です。LINEなどで、アプリのURLと一緒に伝えてください。'),
    h('div', { class: 'row', style: 'flex-wrap:nowrap' },
      h('input', { id: 'teamcode', type: 'text', autocomplete: 'off', value: codeVal, placeholder: '例：harima2026', oninput: e => S.newCode = e.target.value }),
      h('button', { class: 'btn', style: 'flex:none', onclick: saveCode }, '保存')),
    S.code ? null : h('div', { class: 'notice' }, 'まだ合言葉がありません。先に決めて保存してください。')));

  const evCard = h('div', { class: 'card' }, h('div', { class: 'row between' }, h('h2', null, '行事'),
    S.evForm ? null : h('button', { class: 'btn small', onclick: () => { S.evForm = { id: null, title: '', date: '', time: '', place: '', deadline: '', toban: [], tobanWho: {}, memo: '' }; render(); } }, '＋ 行事を追加')));
  if (S.evForm) evCard.append(eventForm());
  const evs = sortedEvents().reverse();
  if (!evs.length && !S.evForm) evCard.append(h('span', { class: 'muted' }, '練習・試合・大会など、出欠を取りたい行事を登録します。当番と変更メモもここで決めます。'));
  for (const ev of evs) {
    const del = S.confirmDel === 'ev:' + ev.id;
    const tb = (ev.toban || []).map(id => famName(famById(id))).filter(Boolean);
    evCard.append(h('div', { class: 'row between', style: 'border-top:1px solid var(--line);padding-top:10px' },
      h('div', { style: 'min-width:0' }, h('strong', null, `${fmtDate(ev.date)} ${ev.title}`),
        h('div', { class: 'muted' }, '当番：' + (tb.length ? tb.join('、') : '未定'))),
      del ? h('div', { class: 'row' }, h('span', { class: 'muted' }, '削除しますか？'),
              h('button', { class: 'btn danger small', onclick: () => delEvent(ev.id) }, '削除'),
              h('button', { class: 'btn ghost small', onclick: () => { S.confirmDel = null; render(); } }, 'やめる'))
          : h('div', { class: 'row' },
              h('button', { class: 'btn ghost small', onclick: () => { S.evForm = { ...ev, toban: [...(ev.toban || [])], tobanWho: { ...(ev.tobanWho || {}) }, memo: ev.memo || '' }; render(); window.scrollTo(0, 0); } }, '編集'),
              h('button', { class: 'btn ghost small', onclick: () => { S.confirmDel = 'ev:' + ev.id; render(); } }, '削除'))));
  }
  out.push(evCard);

  const fams = families();
  out.push(h('div', { class: 'card' },
    h('div', { class: 'row between' }, h('h2', null, '1年生の名簿'), h('span', { class: 'muted' }, `${fams.length}名`)),
    h('div', { class: 'field' },
      h('label', { class: 'label', for: 'bulk' }, 'まとめて追加（1行に1人。Excelの「氏名」の列をコピーしてそのまま貼れます）'),
      h('textarea', { id: 'bulk', placeholder: '山田　太郎\n佐藤　次郎', oninput: e => S.bulk = e.target.value }, S.bulk)),
    h('div', null, h('button', { class: 'btn', onclick: addBulk }, '追加する')),
    h('div', { class: 'stack' }, fams.map((f, i) => {
      const del = S.confirmDel === 'f:' + f.id;
      return h('div', { class: 'row between', style: 'border-bottom:1px solid var(--line);padding-bottom:6px' },
        h('span', null, h('span', { class: 'muted', style: 'display:inline-block;min-width:2em' }, i + 1), f.name),
        del ? h('div', { class: 'row' }, h('button', { class: 'btn danger small', onclick: () => delFamily(f.id) }, '削除'),
                h('button', { class: 'btn ghost small', onclick: () => { S.confirmDel = null; render(); } }, 'やめる'))
            : h('div', { class: 'row' },
                h('button', { class: 'btn ghost small', 'aria-label': f.name + 'を上へ', disabled: i === 0, onclick: () => moveFamily(i, -1) }, '↑'),
                h('button', { class: 'btn ghost small', 'aria-label': f.name + 'を下へ', disabled: i === fams.length - 1, onclick: () => moveFamily(i, 1) }, '↓'),
                h('button', { class: 'btn ghost small', onclick: () => { S.confirmDel = 'f:' + f.id; render(); } }, '削除')));
    }))));

  const mem = [...S.members];
  out.push(h('div', { class: 'card' },
    h('div', { class: 'row between' }, h('h2', null, 'ログインした保護者'), h('span', { class: 'muted' }, `${mem.length}人`)),
    h('span', { class: 'muted' }, '知らない人がいたら「外す」を押してください。その人は合言葉を入れ直すまで中を見られなくなります。'),
    mem.length ? mem.map(m => {
      const f = famById(m.familyId); const del = S.confirmDel === 'm:' + m.id;
      return h('div', { class: 'row between', style: 'border-bottom:1px solid var(--line);padding-bottom:6px' },
        h('div', { style: 'min-width:0' }, h('strong', null, m.name || '（名前なし）'), h('div', { class: 'muted' }, f ? f.name + ' の家庭' : '選手未選択')),
        del ? h('div', { class: 'row' }, h('button', { class: 'btn danger small', onclick: () => delMember(m.id) }, '外す'),
                h('button', { class: 'btn ghost small', onclick: () => { S.confirmDel = null; render(); } }, 'やめる'))
            : h('button', { class: 'btn ghost small', onclick: () => { S.confirmDel = 'm:' + m.id; render(); } }, '外す'));
    }) : h('span', { class: 'muted' }, 'まだいません。')));
  return out;
}

function eventForm() {
  const F = S.evForm;
  const inp = (key, label, type, ph) => h('div', { class: 'field' }, h('label', { class: 'label', for: 'ev-' + key }, label),
    h('input', { id: 'ev-' + key, type: type || 'text', placeholder: ph || '', value: F[key] || '', oninput: e => F[key] = e.target.value }));
  return h('div', { class: 'stack', style: 'background:var(--sunk);border-radius:8px;padding:12px' },
    inp('title', '行事名', 'text', '例：練習試合 vs ○○シニア'),
    h('div', { class: 'grid2' }, inp('date', '日付', 'date'), inp('time', '時間', 'text', '例：8:30集合')),
    h('div', { class: 'grid2' }, inp('place', '場所', 'text', '例：○○球場'), inp('deadline', '回答締切', 'date')),
    h('div', { class: 'stack' }, h('span', { class: 'label' }, '当番（タップするたびに 母→父→両方→外す）'),
      families().length ? h('div', { class: 'duties' }, families().map(f => {
        const on = F.toban.includes(f.id); const who = (F.tobanWho || {})[f.id] || '母';
        return h('button', { class: 'duty', 'aria-pressed': on ? 'true' : 'false', onclick: () => {
          F.tobanWho = { ...(F.tobanWho || {}) };
          if (!on) { F.toban = [...F.toban, f.id]; F.tobanWho[f.id] = '母'; }
          else if (who === '母') F.tobanWho[f.id] = '父';
          else if (who === '父') F.tobanWho[f.id] = '両方';
          else { F.toban = F.toban.filter(x => x !== f.id); delete F.tobanWho[f.id]; }
          render(); } }, f.name, on ? h('small', null, `（${who}）`) : null);
      })) : h('span', { class: 'muted' }, '先に名簿を登録してください。')),
    h('div', { class: 'field' }, h('label', { class: 'label', for: 'ev-memo' }, '連絡メモ（保護者の回答画面に表示されます・空欄でOK）'),
      h('textarea', { id: 'ev-memo', style: 'min-height:60px', placeholder: '例：雨天時は8時に連絡します', oninput: e => F.memo = e.target.value }, F.memo || '')),
    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: saveEvent }, F.id ? '変更を保存' : '行事を登録'),
      h('button', { class: 'btn ghost', onclick: () => { S.evForm = null; render(); } }, 'やめる')));
}
async function saveCode() {
  const c = (S.newCode == null ? S.code : S.newCode).trim();
  if (c.length < 4) { toast('合言葉は4文字以上にしてください'); return; }
  try { await S.db.doc(`${BASE}/private/code`).set({ code: c }); S.code = c; S.newCode = null; toast('合言葉を保存しました'); render(); }
  catch (e) { writeErr(e); }
}
async function saveEvent() {
  const F = S.evForm;
  if (!F.title.trim() || !F.date) { toast('行事名と日付を入れてください'); return; }
  const id = F.id || newId();
  const body = { title: F.title.trim(), date: F.date, time: (F.time || '').trim(), place: (F.place || '').trim(), deadline: F.deadline || '',
                 toban: F.toban || [], tobanWho: F.tobanWho || {}, memo: (F.memo || '').trim() };
  try { await S.db.doc(`${BASE}/events/${id}`).set(body); S.evForm = null; S.sumEvent = id; toast('行事を保存しました'); render(); }
  catch (e) { writeErr(e); }
}
async function delEvent(id) {
  try { await S.db.doc(`${BASE}/events/${id}`).delete(); S.confirmDel = null; toast('行事を削除しました'); render(); }
  catch (e) { writeErr(e); }
}
async function delMember(id) {
  try { await S.db.doc(`${BASE}/members/${id}`).delete(); S.confirmDel = null; toast('外しました'); render(); }
  catch (e) { writeErr(e); }
}
async function saveRoster(list, msg) {
  try { await S.db.doc(BASE).set({ families: list }, { merge: true }); S.confirmDel = null; if (msg) toast(msg); render(); }
  catch (e) { writeErr(e); }
}
function addBulk() {
  const norm = t => t.replace(/[\s　]+/g, '');
  const cur = families();
  const names = S.bulk.split('\n').map(l => l.split('\t')[0].trim()).filter(l => l && !['氏名', '計', '当番', '変更', '自走'].includes(norm(l)) && !/出席表/.test(l));
  if (!names.length) { toast('1行に1人ずつ名前を入れてください'); return; }
  const add = names.filter((n, i) => !cur.some(f => norm(f.name) === norm(n)) && names.findIndex(m => norm(m) === norm(n)) === i)
    .map(n => ({ id: newId(), name: n }));
  S.bulk = '';
  if (!add.length) { toast('新しく追加する名前はありませんでした'); render(); return; }
  saveRoster([...cur, ...add], `${add.length}名を追加しました`);
}
function moveFamily(i, dir) {
  const list = [...families()]; const j = i + dir; if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]]; saveRoster(list);
}
function delFamily(id) { saveRoster(families().filter(f => f.id !== id), '削除しました'); }

// ---------- 起動 ----------
let unsubs = [];
let retries = 0;
function stopData() { unsubs.forEach(u => u()); unsubs = []; S.ready = false; }
function startData() {
  if (unsubs.length) return;
  const got = { team: false, events: false, answers: false };
  if (S.owner) got.members = false;
  const slowTimer = setTimeout(() => { if (!S.ready) { S.slow = true; render(); } }, 10000);
  const mark = (k, snap) => {
    if (!snap.metadata.fromCache) got[k] = true;
    if (!S.ready && Object.values(got).every(Boolean)) { S.ready = true; S.slow = false; retries = 0; clearTimeout(slowTimer); }
    if (S.ready) render();
  };
  const onErr = e => {
    console.error(e); clearTimeout(slowTimer);
    if (e.code === 'permission-denied') {
      stopData();
      if (retries < 3) { retries++; setTimeout(() => { if (S.user && (S.owner || S.member)) startData(); }, 2500); }
      else { S.slow = true; }
    }
    render();
  };
  const db = S.db;
  unsubs.push(db.doc(BASE).onSnapshot({ includeMetadataChanges: true }, s => { S.team = s.exists ? s.data() : { families: [] }; mark('team', s); }, onErr));
  unsubs.push(db.collection(`${BASE}/events`).onSnapshot({ includeMetadataChanges: true }, s => { S.events = s.docs.map(d => ({ id: d.id, ...d.data() })); mark('events', s); }, onErr));
  unsubs.push(db.collection(`${BASE}/answers`).onSnapshot({ includeMetadataChanges: true }, s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.answers = m; mark('answers', s); }, onErr));
  if (S.owner) {
    unsubs.push(db.collection(`${BASE}/members`).onSnapshot({ includeMetadataChanges: true }, s => { S.members = s.docs.map(d => ({ id: d.id, ...d.data() })); mark('members', s); }, onErr));
    db.doc(`${BASE}/private/code`).get().then(s => { S.code = s.exists ? (s.data().code || '') : ''; render(); }).catch(() => {});
  }
}

let memberUnsub = null;
function boot() {
  if (!FIREBASE_CONFIG.apiKey || !window.firebase) { S.fatal = 'index.html の「設定」に Firebase の情報が入っていません。'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  S.auth = firebase.auth(); S.db = firebase.firestore();
  S.auth.getRedirectResult().catch(e => console.error(e));
  document.getElementById('logout').addEventListener('click', () => S.auth.signOut());
  S.auth.onAuthStateChanged(u => {
    S.user = u; S.authReady = true;
    S.owner = !!(u && u.email && ADMIN_EMAILS.map(x => x.toLowerCase()).includes(u.email.toLowerCase()));
    stopData(); if (memberUnsub) { memberUnsub(); memberUnsub = null; }
    S.member = null; S.memberLoaded = false; S.drafts = {}; S.tab = 'answer';
    if (u) {
      memberUnsub = S.db.doc(`${BASE}/members/${u.uid}`).onSnapshot({ includeMetadataChanges: true }, s => {
        if (s.metadata.hasPendingWrites) return;   // 登録がサーバーに届いてから進む
        S.member = s.exists ? s.data() : null; S.memberLoaded = true;
        if (S.owner || S.member) startData(); else stopData();
        render();
      }, e => { console.error(e); S.memberLoaded = true; render(); });
      if (S.owner) startData();
    }
    render();
  });
}
render();
boot();
})();
</script>
</body>
